<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvio for Google Search</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="Nuvio Logo" class="brand-logo">
        <div>
          <h1 class="brand-title">Nuvio</h1>
          <span class="brand-subtitle">Google Search Integration</span>
        </div>
      </div>
      <div class="status-indicator" title="Extension active">
        <span class="status-dot"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <main class="popup-body">
      <section class="section">
        <label class="section-label">Web Streaming Target</label>
        <p class="section-desc">Clicking Watch on Google Search opens titles directly in Nuvio Web.</p>
        <div class="web-target-box">
          <span class="target-url" id="target-web-url">https://nuvio-web.vercel.app/</span>
        </div>
      </section>

      <section class="actions-section">
        <button type="button" id="btn-open-web" class="btn btn-primary">Open Nuvio Web</button>
        <button type="button" id="btn-open-options" class="btn btn-secondary">Settings</button>
      </section>
    </main>

    <footer class="popup-footer">
      <a href="https://nuvio-web.vercel.app/" target="_blank" rel="noopener noreferrer" class="footer-link">Nuvio Web Client</a>
      <span class="footer-sep">·</span>
      <span id="extension-version" class="footer-version">v1.0.0</span>
    </footer>
  </div>

  <script src="../utils/browser-polyfill.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
